<section class="auth-page">
  <div class="auth-card">
    <a routerLink="/" class="brand">ShopNest</a>
    <h1>Welcome Back</h1>
    <p>Sign in to continue shopping.</p>

    @if (error) {
      <div class="error">{{ error }}</div>
    }

    <form (ngSubmit)="submit()">
      <label>Email</label>
      <input type="email" name="email" [(ngModel)]="email" placeholder="you@example.com" autocomplete="email" />

      <label>Password</label>
      <input type="password" name="password" [(ngModel)]="password" placeholder="Enter password" autocomplete="current-password" />

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="switch">Don't have an account? <a routerLink="/register">Create one</a></p>
  </div>
</section>
