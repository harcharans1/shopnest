<header class="navbar">
  <div class="nav-main">
    <div class="nav-container">
      <a routerLink="/" class="brand" aria-label="ShopNest Home">
        <div class="brand-icon">S</div>
        <div class="brand-content">
          <span class="brand-name">ShopNest</span>
          <span class="brand-tagline">Smart Shopping</span>
        </div>
      </a>

      <form class="search-wrapper" (submit)="searchProducts($event)">
        <span class="search-icon">🔍</span>
        <input type="search" [value]="searchText" (input)="onSearchInput($event)" placeholder="Search for products, brands and more..." aria-label="Search products" />
        <button type="submit" class="search-button">Search</button>
      </form>

      <div class="nav-actions">
        <a routerLink="/products" class="account-action" aria-label="Account">
          <span class="action-icon">👤</span>
          <span class="action-content"><small>Welcome</small><strong>Account</strong></span>
        </a>
        <a routerLink="/wishlist" class="wishlist-action" aria-label="Wishlist">
          <span class="heart">{{ wishlistCount > 0 ? '♥' : '♡' }}</span>
          <span class="action-label">Wishlist</span>
        </a>
        <a routerLink="/cart" class="cart-action" aria-label="Shopping cart">
          <span class="cart-icon">🛒</span>
          @if (cartCount > 0) { <span class="cart-badge">{{ cartCount }}</span> }
          <span class="action-content"><small>My</small><strong>Cart</strong></span>
        </a>
      </div>
    </div>
  </div>

  <div class="category-bar">
    <div class="category-container">
      <a routerLink="/products" class="category-all"><span>☰</span> All</a>
      <a routerLink="/products" [queryParams]="{category:'Mobiles'}">Mobiles</a>
      <a routerLink="/products" [queryParams]="{category:'Fashion'}">Fashion</a>
      <a routerLink="/products" [queryParams]="{category:'Electronics'}">Electronics</a>
      <a routerLink="/products" [queryParams]="{category:'Home'}">Home & Kitchen</a>
      <a routerLink="/products" [queryParams]="{category:'Beauty'}">Beauty</a>
      <a routerLink="/products" [queryParams]="{category:'Grocery'}">Grocery</a>
      <a routerLink="/products" [queryParams]="{category:'Sports'}">Sports</a>
      <a routerLink="/products" [queryParams]="{category:'Accessories'}">Accessories</a>
      <a routerLink="/products" [queryParams]="{deal:'true'}" class="deals">🔥 Today's Deals</a>
    </div>
  </div>
</header>
